<!DOCTYPE html>
<html>
<head>
<style>
.table {
    display: table;
}
.group {
    display: table-row-group;
}
.row {
    display: table-row;
}
.cell {
    display: table-cell;
    border: 1px solid black;
    padding: 10px;
}
</style>
</head>
<body>
<h3>display: table-row-group</h3>
<div class="table">
    <div class="group">
        <div class="row">
            <div class="cell">Anu</div>
            <div class="cell">20</div>
        </div>
    </div>
</div>
</body>
</html>

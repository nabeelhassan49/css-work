<!DOCTYPE html>
<html>
<head>
<style>
.container {
    display: inline-table;
    border: 1px solid black;
}
.cell {
    display: table-cell;
    padding: 50px;
    border: 1px solid blue;
}
</style>
</head>
<body>
<h3>display: inline-table</h3>
<div class="container">
    <div class="cell">Name</div>
    <div class="cell">Age</div>
</div>
</body>
</html>

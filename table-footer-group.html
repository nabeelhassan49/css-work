<!DOCTYPE html>
<html>
<head>
<style>
.table {
    display: table;
    border: 1px solid black;
}
.footer {
    display: table-footer-group;
}
.row {
    display: table-row;
}
.cell {
    display: table-cell;
    padding: 10px;
    border: 1px solid blue;
}
</style>
</head>
<body>
<h3>display: table-footer-group</h3>
<div class="table">
    <div class="footer">
        <div class="row">
            <div class="cell">Total</div>
            <div class="cell">100</div>
        </div>
    </div>
</div>
</body>
</html>

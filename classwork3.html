
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Info</title>

    <style>
        h3 {
            text-align: right;
            color: darkblue;
            font-family: Georgia, serif;
        }

        .tagline {
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        table {
            width: 50%;
            margin: 20px auto;
            border: 1px solid black;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid black;
            padding: 12px;
            text-align: center;
            vertical-align: middle;
        }

        th {
            background-color: lightblue;
        }
    </style>
</head>
<body>

    <h3>ABC Technologies</h3>

    <p class="tagline">info Technology</p>

    <table>
        <tr>
            <th>Department</th>
            <th>Contact Number</th>
        </tr>
        <tr>
            <td>IT</td>
            <td>9123456789</td>
        </tr>
        <tr>
            <td>Machine learning</td>
            <td>9458311140</td>
        </tr>
    </table>

</body>
</html>

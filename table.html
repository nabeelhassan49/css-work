<!DOCTYPE html>
<html>
<head>
<style>
.container {
    display: table;
    border: 1px solid black;
}
.row {
    display: table-row;
}
.cell {
    display: table-cell;
    border: 1px solid blue;
    padding: 10px;
}
</style>
</head>
<body>
<h3>display: table</h3>
<div class="container">
    <div class="row">
        <div class="cell">Name</div>
        <div class="cell">Age</div>
    </div>
    <div class="row">
        <div class="cell">Anu</div>
        <div class="cell">20</div>
    </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<style>
.row {
    display: table-row;
}
.cell {
    display: table-cell;
    border: 1px solid black;
    padding: 10px;
}
</style>
</head>
<body>
<h3>display: table-row</h3>
<div class="row">
    <div class="cell">Name</div>
    <div class="cell">Age</div>
</div>
</body>
</html>

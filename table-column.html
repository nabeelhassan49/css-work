<!DOCTYPE html>
<html>
<head>
<style>
.table {
    display: table;
    border-collapse: collapse;
}
.column {
    display: table-column;
    background: lightyellow;
}
.row {
    display: table-row;
}
.cell {
    display: table-cell;
    border: 1px solid black;
    padding: 10px;
}
</style>
</head>
<body>
<h3>display: table-column</h3>
<div class="table">
    <div class="column"></div>
    <div class="column"></div>
    <div class="row">
        <div class="cell">Name</div>
        <div class="cell">Age</div>
    </div>
    <div class="row">
        <div class="cell">Anu</div>
        <div class="cell">20</div>
    </div>
</div>
</body>
</html>

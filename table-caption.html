<!DOCTYPE html>
<html>
<head>
<style>
.caption {
    display: table-caption;
    caption-side: top;
    font-weight: bold;
}
.table {
    display: table;
    border: 1px solid black;
}
.row {
    display: table-row ;
}
.column{
    display: table-column 2;
    border:1px rgb(161, 82, 26);
}
.cell {
    display: table-cell;
    border: 1px solid blue;
    padding: 10px;
}
</style>
</head>
<body>
<h3>display: table-caption</h3>
<div class="table">
    <div class="caption">Student Details</div>
    <div class="row">
        <div class="column">
        <div class="cell">Name</div>
        <div class="cell">Anu</div>
        <div class="column">Name</div>
        <div class="column">Anu</div>
    </div>
</div>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layered Box Model</title>

<style>
    .outer {
        border: 10px solid black;
        padding: 30px;
        background-color: rgb(170, 151, 151)
    }

    .middle {
        border: 6px solid rgb(7, 1, 56);
        padding: 20px;
        margin: 10px;
        background-color: rgb(13, 172, 221);
    }

    .inner {
        border: 3px solid rgb(35, 9, 59);
        padding: 20px;
        margin: 10px;
        background-color: rgb(233, 173, 245);
        text-align: center;
    }
</style>


</head>
<body>
<div class="outer">
    <h2>Outer Container Box</h2>

    <div class="middle">
        <h3>Middle Box</h3>

        <div class="inner">
            <p>Inner Box</p>
        </div>

    </div>
</div>
</body>
